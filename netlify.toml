[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonicalise the .html form of every page onto the extensionless URL that
# Netlify already serves and that every canonical tag points at. force = true is
# required: without it Netlify skips the rule because the .html file really exists.
# Query strings are carried through, which matters for the Snapshot verify link.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

